name: Check the faucet links

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ask every link for an answer
        run: python tools/check-links.py
      - name: Commit status.json when it changed
        run: |
          if git diff --quiet -- status.json; then
            echo "Every link answered as before"
            exit 0
          fi
          git config user.name "moonspiid"
          git config user.email "355058268+moonspiid@users.noreply.github.com"
          git add status.json
          git commit -m "Refresh the faucet status file"
          git push
